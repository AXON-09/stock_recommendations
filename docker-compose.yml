version: '3.8'

services:
  quantview:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantview-ai
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
